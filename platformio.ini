[platformio]
src_dir = firmware

[env:dsh-prose-rev-d]
platform = espressif32@6.12.0
board = dsh-prose-rev-d
framework = arduino
build_src_filter = +<src/*.cpp> +<ui/prose_ui.cpp>
build_flags = -I firmware/ui
monitor_speed = 115200
lib_deps =
  zinggjm/GxEPD2@1.6.5
  adafruit/Adafruit GFX Library@1.12.1
